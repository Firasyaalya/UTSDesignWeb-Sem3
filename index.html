<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login - UTS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="left-section">
            <img src="foto/bg.jpg" alt="picture">
        </section>

        <section class="right-section">
            <div class="form-box">
                <div class="logo">
                <span class="brand-name">ShadeDesign</span>
            </div>

                <h1>Create your account</h1>
                <p class="subtitle">Enter Your Account</p>

                <button type="button" class="btn-google" aria-label="Sign in with Google">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" width="18">
                    <span>Continue with Google</span>
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email">Work email</label>
                        <input type="email" id="email" name="email" placeholder="you@company.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Remember Me</span>
                        </label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-submit">Sign In</button>
                </form>

                <p class="footer-text">Already have an account? <a href="#">Log in</a></p>
            </div>
        </section>
    </main>

</body>
</html>
